[package]
name = "chimera-installer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Graficzny instalator Chimera Linux (GTK4 + libadwaita)"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

[profile.release]
lto = true
strip = true
